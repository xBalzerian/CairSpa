        const container = link.parentElement;

        ALL_AREAS.forEach(a => {
          const el = link.cloneNode();
          el.href = a.href;
          el.textContent = a.label;
          el.className = link.className;
          container.appendChild(el);
        });
      });

      nav.dataset.navPatched = '1';
      return true;
    }
